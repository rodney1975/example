[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "processor-1080"
version = "1.0.0"
description = "A data processing application for 1080 data files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
processor-1080 = "processor_1080.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
